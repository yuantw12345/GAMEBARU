  <script>
    const SUPABASE_URL = 'https://keadrtohkrjoltcissqj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__dXhUS3eSgSx6Op3hVIYpQ_IKMhqMos';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const bgChannel = client.channel('app-bg-sync', { config: { broadcast: { self: true } } });

    let currentTab = 'GRUPING 1';

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputText').addEventListener('input', updateCharCount);
      loadSavedBackground();
      fetchLatestBackgroundFromStorage(); // 🔥 Otomatis cek background terbaru dari Supabase Storage saat dibuka
    });

    bgChannel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        bgChannel.send({ type: 'broadcast', event: 'request_bg', payload: {} });
      }
    });

    bgChannel.on('broadcast', { event: 'update_bg' }, ({ payload }) => {
      if (payload.mediaUrl) {
        applyBackground(payload.mediaUrl, payload.mediaType);
        localStorage.setItem('custom_app_bg', payload.mediaUrl);
        localStorage.setItem('custom_app_bg_type', payload.mediaType);
      } else {
        resetBackgroundLocal();
      }
    });

    // Fungsi otomatis menarik file terbaru dari Supabase Storage saat halaman dimuat
    async function fetchLatestBackgroundFromStorage() {
      try {
        const { data: files, error } = await client.storage.from('backgrounds').list('', {
          sortBy: { column: 'created_at', order: 'desc' }
        });
        
        if (!error && files && files.length > 0) {
          // Ambil file yang paling baru diupload
          const latestFile = files[0];
          const { data: publicURLData } = client.storage.from('backgrounds').getPublicUrl(latestFile.name);
          const publicUrl = publicURLData.publicUrl;
          const isVideo = latestFile.name.endsWith('.mp4');
          const mediaType = isVideo ? 'video' : 'image';

          // Cocokkan dengan localStorage, jika berbeda update otomatis
          const savedBg = localStorage.getItem('custom_app_bg');
          if (savedBg !== publicUrl) {
            applyBackground(publicUrl, mediaType);
            localStorage.setItem('custom_app_bg', publicUrl);
            localStorage.setItem('custom_app_bg_type', mediaType);
          }
        }
      } catch (err) {
        console.log("Gagal memuat background dari storage:", err);
      }
    }

    async function uploadAndSyncBackground(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStatus('Mengunggah file ke Supabase Storage...', 'info');

      const isVideo = file.type.startsWith('video/');
      const fileExt = file.name.split('.').pop();
      const fileName = `bg_${Date.now()}.${fileExt}`;

      const { data: existingFiles } = await client.storage.from('backgrounds').list();
      const { error } = await client.storage.from('backgrounds').upload(fileName, file, { cacheControl: '3600', upsert: true });

      if (error) {
        alert('Gagal mengunggah file: ' + error.message);
        showStatus('Gagal mengunggah background.', 'error');
        return;
      }

      const { data: publicURLData } = client.storage.from('backgrounds').getPublicUrl(fileName);
      const publicUrl = publicURLData.publicUrl;
      const mediaType = isVideo ? 'video' : 'image';

      applyBackground(publicUrl, mediaType);
      localStorage.setItem('custom_app_bg', publicUrl);
      localStorage.setItem('custom_app_bg_type', mediaType);

      bgChannel.send({ type: 'broadcast', event: 'update_bg', payload: { mediaUrl: publicUrl, mediaType: mediaType } });
      showStatus('Background berhasil disinkronkan & dibersihkan otomatis!', 'success');

      if (existingFiles && existingFiles.length > 0) {
        const filesToDelete = existingFiles.map(f => f.name).filter(name => name !== fileName);
        if (filesToDelete.length > 0) {
          await client.storage.from('backgrounds').remove(filesToDelete);
        }
      }
    }

    function resetAndSyncBackground() {
      resetBackgroundLocal();
      bgChannel.send({ type: 'broadcast', event: 'update_bg', payload: { mediaUrl: null, mediaType: null } });
      showStatus('Background di-reset untuk semua perangkat.', 'info');
    }

    function resetBackgroundLocal() {
      document.body.style.backgroundImage = 'none';
      const videoEl = document.getElementById('bgVideo');
      videoEl.pause();
      videoEl.classList.add('hidden');
      localStorage.removeItem('custom_app_bg');
      localStorage.removeItem('custom_app_bg_type');
      document.getElementById('btnResetBg').classList.add('hidden');
      document.getElementById('bgUploader').value = '';
    }

    function applyBackground(mediaUrl, mediaType) {
      const videoEl = document.getElementById('bgVideo');
      const sourceEl = document.getElementById('videoSource');

      if (mediaType === 'video') {
        document.body.style.backgroundImage = 'none';
        sourceEl.src = mediaUrl;
        videoEl.load();
        videoEl.classList.remove('hidden');
        videoEl.play().catch(err => console.log("Autoplay dicegah browser:", err));
      } else {
        videoEl.pause();
        videoEl.classList.add('hidden');
        document.body.style.backgroundImage = `url('${mediaUrl}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
      }
      document.getElementById('btnResetBg').classList.remove('hidden');
    }

    function loadSavedBackground() {
      const savedBg = localStorage.getItem('custom_app_bg');
      const savedType = localStorage.getItem('custom_app_bg_type') || 'image';
      if (savedBg) applyBackground(savedBg, savedType);
    }

    function switchTab(tabName) {
      currentTab = tabName;
      document.getElementById('currentTabLabel').textContent = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn py-2.5 font-bold rounded-xl transition text-xs text-zinc-400 hover:text-white hover:bg-zinc-900";
      });
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn py-2.5 font-bold rounded-xl transition text-xs bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-900/20";
      }
      showStatus(`Aktif di ${tabName}`, 'info');
    }

    function updateCharCount() {
      document.getElementById('charCount').textContent = document.getElementById('inputText').value.length;
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('inputText').value = text;
        updateCharCount();
        showStatus('Teks berhasil ditempel dari clipboard!', 'info');
      } catch (err) { alert('Gagal membaca clipboard.'); }
    }

    // --- LOGIKA UTAMA PARSER LOKAL YANG AMAN & BERSIH ---
    function processAndShowResult() {
      const rawText = document.getElementById('inputText').value;
      if (!rawText.trim()) {
        showStatus('Isi teks terlebih dahulu!', 'error');
        return;
      }

      try {
        const lines = rawText.split(/\r?\n/).map(line => line.trim()).filter(line => line !== "");

        let web = "-";
        const platIdx = lines.findIndex(l => l.toLowerCase() === "platform");
        if (platIdx !== -1 && lines[platIdx + 1]) {
          web = lines[platIdx + 1];
        }

        let userId = "-";
        const uidIdx = lines.findIndex(l => l.toLowerCase() === "user id");
        if (uidIdx !== -1 && lines[uidIdx + 1] && /^\d+$/.test(lines[uidIdx + 1])) {
          userId = lines[uidIdx + 1];
        } else {
          const matchId = rawText.match(/\b(\d{6})\b/);
          if (matchId) userId = matchId[1];
        }

        let username = "-";
        for (let i = 0; i < lines.length; i++) {
          if (/^FP\d{14}/i.test(lines[i])) {
            if (lines[i+1] && lines[i+1].toLowerCase() !== "copy") {
              username = lines[i+1];
              break;
            }
          }
        }

        let nominalWD = 0;
        for (let i = 0; i < lines.length; i++) {
          if (lines[i].toLowerCase().includes("withdraw")) {
            for (let j = i; j < Math.min(i + 4, lines.length); j++) {
              const cleanNum = lines[j].replace(/^Withdraw/i, "").trim();
              const matchNom = cleanNum.match(/^([\d,]+)/);
              if (matchNom && matchNom[1].includes(",")) {
                const val = parseInt(matchNom[1].replace(/,/g, ""), 10);
                if (val > 1000) {
                  nominalWD = val;
                  break;
                }
              }
            }
            if (nominalWD > 0) break;
          }
        }

        let depositTerakhir = 0;
        for (let i = 0; i < lines.length; i++) {
          if (/topup/i.test(lines[i])) {
            const matches = lines[i].match(/([\d]{1,3}(?:,\d{3})+)/g);
            if (matches && matches.length > 0) {
              depositTerakhir = parseInt(matches[0].replace(/,/g, ""), 10);
              break;
            } else if (lines[i + 1]) {
              const nextMatch = lines[i + 1].match(/^([\d,]+)/);
              if (nextMatch && nextMatch[1].includes(",")) {
                depositTerakhir = parseInt(nextMatch[1].replace(/,/g, ""), 10);
                break;
              }
            }
          }
        }

        let maxKemenangan = 0;
        lines.forEach(line => {
          if (line.toLowerCase().includes("transfer back")) {
            const matches = line.match(/([\d]{1,3}(?:,\d{3})+)/g);
            if (matches && matches.length > 0) {
              const val = parseInt(matches[matches.length - 1].replace(/,/g, ""), 10);
              if (val > maxKemenangan) {
                maxKemenangan = val;
              }
            }
          }
        });

        const providerRegex = /(SV388|Poker Bolt|SBOBET|PG Soft|Evolution Gaming|PokerQ|NetEnt|Lotwin|CMD|Habanero|Cosmo Play|Sexy Casino|BTI|Playtech|Relax Gaming|GamePlay|Spadegaming|SA Gaming|TF Gaming|Playstar|Red Tiger|No Limit City|CQ9 Slot|Big Time Gaming|Jili Gaming|Advant Play|Naga Games|Pragmatic Play|Miki World|568Win|Hacksaw|Evoplay|FastSpin|SABA Sports|5G Gaming|Nex4D|FunTa Gaming|Pragmatic Play POP|CosmoPlay Crash|GGSoft|GA28|King Midas|Tap A Roo|AFB Sports|AFB Gaming)/i;
        
        const chronologicalLines = [...lines].reverse();
        let modalTerakhirPerProvider = {};
        let providerLolos = new Set();

        chronologicalLines.forEach(line => {
          if (/^Transfer to/i.test(line)) {
            const matchProv = line.match(providerRegex);
            const matchNom = line.match(/([\d]{1,3}(?:,\d{3})+)/);
            if (matchProv && matchNom) {
              const provName = matchProv[1].trim();
              const nominalTo = parseInt(matchNom[1].replace(/,/g, ""), 10);
              modalTerakhirPerProvider[provName.toLowerCase()] = nominalTo;
            }
          }

          if (/transfer back/i.test(line)) {
            const matchProv = line.match(providerRegex);
            const matchesNom = line.match(/([\d]{1,3}(?:,\d{3})+)/g);
            if (matchProv && matchesNom && matchesNom.length > 0) {
              const provName = matchProv[1].trim();
              const nominalBack = parseInt(matchesNom[matchesNom.length - 1].replace(/,/g, ""), 10);
              const modalTo = modalTerakhirPerProvider[provName.toLowerCase()] || 0;

              const selisih = nominalBack - modalTo;
              if (selisih >= 3000000) {
                providerLolos.add(provName);
              }
            }
          }
        });

        const daftarProvider = Array.from(providerLolos);
        const kemenanganProviderText = daftarProvider.length > 0 ? daftarProvider.join(" dan ") : "-";
        const formatRupiah = (angka) => angka.toLocaleString("en-US");
        const penutupA7 = "mohon bantu cek ya pak/bu sah atau tidak🙏";

        const isiA1 = `Web : ${web}
Username : ${username}
User ID : ${userId}
Nominal WD : ${formatRupiah(nominalWD)}
Total Kemenangan : ${formatRupiah(maxKemenangan)}
Kemenangan Provider : ${kemenanganProviderText}

${penutupA7}`;

        const isiA3 = `WEB : ${web}
USERNAME : ${username}
NOMINAL WD : ${formatRupiah(nominalWD)}
BANK : 

Sudah di check dan sah, boleh di format ka ?`;

        const isiA2 = `FORMAT WD DI ATAS 100JT

ID : ${username}
WEB : ${web}
BANK : 
DEPOSIT TERAKHIR : ${formatRupiah(depositTerakhir)}
TOTAL DEPOSIT SELAMA MAIN : 
NOMINAL WD : ${formatRupiah(nominalWD)}
KEMENANGAN : ${formatRupiah(maxKemenangan)}
Kemenangan Provider : ${kemenanganProviderText}
LINK KEMENANGAN : 

${penutupA7}`;

        const tampilA1 = true;
        const tampilA3 = nominalWD >= 50000001 && nominalWD <= 99999999;
        const tampilA2 = nominalWD >= 100000000;

        displayFormatResult({
          isiA1: isiA1,
          tampilA1: tampilA1,
          isiA3: isiA3,
          tampilA3: tampilA3,
          isiA2: isiA2,
          tampilA2: tampilA2
        });

        openModal();
        showStatus('Transaksi berhasil diproses lokal!', 'success');

      } catch (err) {
        console.error("Error saat memproses data:", err);
        showStatus('Terjadi kesalahan saat membaca data. Pastikan format teks benar!', 'error');
      }
    }

    function displayFormatResult(data) {
      document.getElementById('modalTabTitle').textContent = currentTab;
      document.getElementById('boxA1').textContent = data.isiA1 || '-';
      
      const wrapA3 = document.getElementById('wrapperA3');
      if (data.tampilA3) { 
        wrapA3.classList.remove('hidden'); 
        document.getElementById('boxA3').textContent = data.isiA3; 
      } else { 
        wrapA3.classList.add('hidden'); 
      }

      const wrapA2 = document.getElementById('wrapperA2');
      if (data.tampilA2) { 
        wrapA2.classList.remove('hidden'); 
        document.getElementById('boxA2').textContent = data.isiA2; 
      } else { 
        wrapA2.classList.add('hidden'); 
      }
    }

    function openModal() {
      const modal = document.getElementById('resultModal');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('modalContent').classList.remove('scale-95'); }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('resultModal');
      modal.classList.add('opacity-0');
      document.getElementById('modalContent').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
      document.getElementById('inputText').value = '';
      updateCharCount();
    }

    function copyToClipboard(boxId, toastId) {
      navigator.clipboard.writeText(document.getElementById(boxId).textContent).then(() => {
        const toast = document.getElementById(toastId);
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2000);
      });
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden', 'border-emerald-500/30', 'border-rose-500/30', 'border-sky-500/30', 'text-emerald-300', 'text-rose-300', 'text-sky-300');
      let icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : (type === 'error' ? '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>' : '<i class="fa-solid fa-circle-info text-sky-400"></i>');
      let borderColor = type === 'success' ? 'border-emerald-500/30' : (type === 'error' ? 'border-rose-500/30' : 'border-sky-500/30');
      box.classList.add(borderColor);
      box.innerHTML = `${icon} <span class="text-zinc-200">${msg}</span>`;
    }
  </script>
</body>
</html>
