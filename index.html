  <script>
    const SUPABASE_URL = 'https://keadrtohkrjoltcissqj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__dXhUS3eSgSx6Op3hVIYpQ_IKMhqMos';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const bgChannel = client.channel('app-bg-sync', { config: { broadcast: { self: true } } });
    const gameChannel = client.channel('family100-room', { config: { broadcast: { self: true } } });

    const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzZSS4Jv-IoVN_51xZuZ6UmtqTVyI_gmGTWYi6CV9IHUgJs4xTbaGeLj1WXyfaNwCn5SA/exec';
    let currentTab = 'GRUPING 1';

    // --- BANK SOAL FAMILY 100 ---
    const questionBank = [
      {
        q: "Sebutkan hal yang sering dilakukan orang saat pertama kali bangun tidur!",
        answers: [
          { text: "Menguap / Meregangkan Badan", points: 45, revealed: false },
          { text: "Mengecek HP / Notifikasi", points: 30, revealed: false },
          { text: "Ke Kamar Mandi / Buang Air", points: 15, revealed: false },
          { text: "Minum Air Putih", points: 10, revealed: false }
        ]
      },
      {
        q: "Apa yang dicari orang ketika kelaparan di malam hari?",
        answers: [
          { text: "Mi Instan", points: 50, revealed: false },
          { text: "Nasi Goreng / Makanan Sisa", points: 25, revealed: false },
          { text: "Roti Bakar / Snack", points: 15, revealed: false },
          { text: "Air Putih (Nahan Lapar)", points: 10, revealed: false }
        ]
      },
      {
        q: "Sebutkan alasan orang sering terlambat masuk kerja atau kuliah!",
        answers: [
          { text: "Bangun Kesiangan", points: 40, revealed: false },
          { text: "Macet di Jalan", points: 30, revealed: false },
          { text: "Ban Bocor / Kendaraan Rusak", points: 15, revealed: false },
          { text: "Kesiapan Berangkat Lama (Dandan/Mandi)", points: 15, revealed: false }
        ]
      }
    ];

    let currentQuestionData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      document.getElementById('scriptUrl').value = savedUrl;
      document.getElementById('inputText').addEventListener('input', updateCharCount);
      loadSavedBackground();
    });

    // --- SINKRONISASI REALTIME BACKGROUND ---
    bgChannel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        bgChannel.send({ type: 'broadcast', event: 'request_bg', payload: {} });
      }
    });

    bgChannel.on('broadcast', { event: 'update_bg' }, ({ payload }) => {
      if (payload.imgUrl) {
        applyBackground(payload.imgUrl);
        localStorage.setItem('custom_app_bg', payload.imgUrl);
      } else {
        resetBackgroundLocal();
      }
    });

    bgChannel.on('broadcast', { event: 'request_bg' }, () => {
      const currentBg = localStorage.getItem('custom_app_bg');
      if (currentBg) {
        bgChannel.send({ type: 'broadcast', event: 'update_bg', payload: { imgUrl: currentBg } });
      }
    });

    function uploadAndSyncBackground(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStatus('Mengirim & Mensinkronkan Foto Background...', 'info');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 1280;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

          applyBackground(compressedBase64);
          localStorage.setItem('custom_app_bg', compressedBase64);

          bgChannel.send({
            type: 'broadcast',
            event: 'update_bg',
            payload: { imgUrl: compressedBase64 }
          });

          showStatus('Background berhasil disinkronkan ke SEMUA perangkat!', 'success');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetAndSyncBackground() {
      resetBackgroundLocal();
      bgChannel.send({ type: 'broadcast', event: 'update_bg', payload: { imgUrl: null } });
      showStatus('Background di-reset untuk semua perangkat.', 'info');
    }

    function resetBackgroundLocal() {
      document.body.style.backgroundImage = 'none';
      localStorage.removeItem('custom_app_bg');
      document.getElementById('btnResetBg').classList.add('hidden');
      document.getElementById('bgUploader').value = '';
    }

    function applyBackground(imgUrl) {
      document.body.style.backgroundImage = `url('${imgUrl}')`;
      document.getElementById('btnResetBg').classList.remove('hidden');
    }

    function loadSavedBackground() {
      const savedBg = localStorage.getItem('custom_app_bg');
      if (savedBg) applyBackground(savedBg);
    }


    // --- REALTIME GAME FAMILY 100 LOGIC ---
    gameChannel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        gameChannel.send({ type: 'broadcast', event: 'request_game_state', payload: {} });
      }
    });

    gameChannel.on('broadcast', { event: 'update_game_state' }, ({ payload }) => {
      currentQuestionData = payload.questionData;
      renderGameUI();
    });

    gameChannel.on('broadcast', { event: 'request_game_state' }, () => {
      if (currentQuestionData) {
        gameChannel.send({ type: 'broadcast', event: 'update_game_state', payload: { questionData: currentQuestionData } });
      }
    });

    function nextGameQuestion() {
      const randomIndex = Math.floor(Math.random() * questionBank.length);
      const selected = JSON.parse(JSON.stringify(questionBank[randomIndex]));
      
      currentQuestionData = selected;

      gameChannel.send({
        type: 'broadcast',
        event: 'update_game_state',
        payload: { questionData: currentQuestionData }
      });

      renderGameUI();
      showStatus('Soal Family 100 baru dimuat!', 'success');
    }

    // Fitur Menyerah / Buka Semua Jawaban
    function revealAllAnswers() {
      if (!currentQuestionData) return;
      currentQuestionData.answers.forEach(ans => ans.revealed = true);

      gameChannel.send({
        type: 'broadcast',
        event: 'update_game_state',
        payload: { questionData: currentQuestionData }
      });

      renderGameUI();
      showStatus('Semua jawaban dibuka (Menyerah)!', 'error');
    }

    function renderGameUI() {
      if (!currentQuestionData) return;
      document.getElementById('gameQuestion').textContent = currentQuestionData.q;

      const container = document.getElementById('gameAnswersContainer');
      container.innerHTML = '';

      currentQuestionData.answers.forEach((ans, index) => {
        const div = document.createElement('div');
        if (ans.revealed) {
          div.className = "bg-emerald-950/80 border border-emerald-600 rounded-lg p-2.5 text-xs text-emerald-200 font-mono flex justify-between items-center animate-pulse";
          div.innerHTML = `<span>${index + 1}. ${ans.text}</span> <span class="bg-emerald-600 text-white px-2 py-0.5 rounded font-bold">${ans.points}</span>`;
        } else {
          div.className = "bg-black/60 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-400 font-mono flex justify-between items-center";
          div.innerHTML = `<span>${index + 1}. [Tersembunyi]</span> <span>...</span>`;
        }
        container.appendChild(div);
      });
    }

    function sendGameGuess() {
      const guessInput = document.getElementById('playerGuess');
      const guess = guessInput.value.trim().toLowerCase();
      if (!guess) return;

      if (!currentQuestionData) {
        alert('Belum ada soal yang aktif!');
        return;
      }

      let found = false;
      currentQuestionData.answers.forEach(ans => {
        if (!ans.revealed && ans.text.toLowerCase().includes(guess)) {
          ans.revealed = true;
          found = true;
        }
      });

      if (found) {
        gameChannel.send({
          type: 'broadcast',
          event: 'update_game_state',
          payload: { questionData: currentQuestionData }
        });
        renderGameUI();
        showStatus(`Tebakan benar! Jawaban terbuka.`, 'success');
      } else {
        showStatus(`Tebakan "${guess}" salah atau sudah terbuka.`, 'error');
      }

      guessInput.value = '';
    }


    // --- LOGIKA FORMAT TRANSAKSI KERJA ---
    function switchTab(tabName) {
      currentTab = tabName;
      document.getElementById('currentTabLabel').textContent = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn py-2 font-bold rounded-lg transition text-slate-300 hover:text-white hover:bg-slate-900";
      });
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) activeBtn.className = "tab-btn py-2 font-bold rounded-lg transition bg-emerald-600 text-white shadow";
      showStatus(`Aktif di ${tabName}`, 'info');
    }

    function updateCharCount() {
      document.getElementById('charCount').textContent = document.getElementById('inputText').value.length;
    }

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('hidden');
    }

    function saveSettings() {
      const url = document.getElementById('scriptUrl').value.trim();
      if (!url) return alert('URL tidak boleh kosong!');
      localStorage.setItem('gs_script_url', url);
      showStatus('URL Pengaturan berhasil disimpan!', 'success');
      toggleSettings();
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('inputText').value = text;
        updateCharCount();
        showStatus('Teks berhasil ditempel dari clipboard!', 'info');
      } catch (err) { alert('Gagal membaca clipboard.'); }
    }

    function hapusWebDanSheet() {
      const url = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      document.getElementById('inputText').value = '';
      updateCharCount();
      closeModal();
      setLoading(true, 'clearSheetBtn', 'btnClearSheetText', '<i class="fa-solid fa-spinner fa-spin"></i> Menghapus...');
      fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: "clearSheet", sheetName: currentTab }) })
      .then(() => showStatus(`Teks & Data di ${currentTab} berhasil dihapus!`, 'error'))
      .finally(() => setLoading(false, 'clearSheetBtn', 'btnClearSheetText', 'HAPUS TEKS'));
    }

    function sendToSheet() {
      const text = document.getElementById('inputText').value;
      const url = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      if (!text.trim()) return showStatus('Isi teks terlebih dahulu!', 'error');

      setLoading(true, 'sendBtn', 'btnText', '<i class="fa-solid fa-spinner fa-spin"></i> Kirim...');
      hideStatus();
      fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: text, sheetName: currentTab }) })
      .then(() => { showStatus(`Berhasil dikirim ke ${currentTab}!`, 'success'); setTimeout(fetchFormatOnly, 1200); })
      .finally(() => setLoading(false, 'sendBtn', 'btnText', 'Kirim Transaksi'));
    }

    function fetchFormatOnly() {
      const url = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      setLoading(true, 'fetchBtn', null, null);
      showStatus(`Memuat format dari ${currentTab}...`, 'info');
      fetch(url, { method: 'POST', redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "getFormat", sheetName: currentTab }) })
      .then(res => res.json())
      .then(data => {
        if (data && data.isiA1 !== undefined) {
          document.getElementById('modalTabTitle').textContent = currentTab;
          displayFormatResult(data);
          openModal();
          showStatus(`Format ${currentTab} dimuat!`, 'success');
        }
      })
      .finally(() => setLoading(false, 'fetchBtn', null, null));
    }

    function displayFormatResult(data) {
      document.getElementById('boxA1').textContent = data.isiA1 || '-';
      const wrapA2 = document.getElementById('wrapperA2');
      if (data.adaWithdrawDiatas100Jt) { wrapA2.classList.remove('hidden'); document.getElementById('boxA2').textContent = data.isiA2; } else wrapA2.classList.add('hidden');
      const wrapA3 = document.getElementById('wrapperA3');
      if (data.adaWithdrawDiatas50Jt) { wrapA3.classList.remove('hidden'); document.getElementById('boxA3').textContent = data.isiA3; } else wrapA3.classList.add('hidden');
    }

    function openModal() {
      const modal = document.getElementById('resultModal');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('modalContent').classList.remove('scale-95'); }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('resultModal');
      modal.classList.add('opacity-0');
      document.getElementById('modalContent').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 200);
    }

    function copyToClipboard(boxId, toastId) {
      navigator.clipboard.writeText(document.getElementById(boxId).textContent).then(() => {
        const toast = document.getElementById(toastId);
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2000);
      });
    }

    function setLoading(isLoading, btnId, textId, htmlContent) {
      const btn = document.getElementById(btnId);
      btn.disabled = isLoading;
      if (isLoading) btn.classList.add('opacity-75', 'cursor-not-allowed');
      else btn.classList.remove('opacity-75', 'cursor-not-allowed');
      if (textId) document.getElementById(textId).innerHTML = htmlContent;
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden', 'bg-emerald-950', 'text-emerald-300', 'border-emerald-600', 'bg-rose-950', 'text-rose-300', 'border-rose-600', 'bg-sky-950', 'text-sky-300', 'border-sky-600');
      let icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : (type === 'error' ? '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>' : '<i class="fa-solid fa-circle-info text-sky-400"></i>');
      box.classList.add(type === 'success' ? 'bg-emerald-950' : (type === 'error' ? 'bg-rose-950' : 'bg-sky-950'), type === 'success' ? 'border-emerald-600' : (type === 'error' ? 'border-rose-600' : 'border-sky-600'));
      box.innerHTML = `${icon} <span class="text-white">${msg}</span>`;
    }

    function hideStatus() { document.getElementById('statusBox').classList.add('hidden'); }
  </script>
</body>
</html>
