<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STICKMAN FIGHTING 1V1 REALTIME SUPABASE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Inter', sans-serif; user-select: none; }
    canvas { background: linear-gradient(to bottom, #0f172a, #1e293b); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="max-w-3xl w-full space-y-4">

    <!-- HEADER & STATUS LOBBY -->
    <div class="bg-slate-800 border border-slate-700 shadow-xl rounded-2xl p-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl">
          <i class="fa-solid fa-hand-fist text-2xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white">Stickman Brawl 1v1 Realtime</h1>
          <p id="statusGame" class="text-xs text-amber-400">Menghubungkan ke Supabase...</p>
        </div>
      </div>
      <div class="text-right">
        <span id="playerRoleBadge" class="bg-slate-700 text-slate-300 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase">Penonton</span>
      </div>
    </div>

    <!-- PANEL PILIH PERAN -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-3">
      <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider text-center">Pilih Slot Karakter Anda</h3>
      <div class="grid grid-cols-2 gap-3">
        
        <!-- Slot Pemain 1 -->
        <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex flex-col items-center space-y-2">
          <span class="text-xs font-bold text-rose-400">🔴 Pemain 1 (Kiri)</span>
          <span id="labelP1" class="text-[11px] text-slate-400 italic">Kosong</span>
          <button id="btnJoinP1" onclick="joinRole('p1')" class="text-xs bg-rose-600 hover:bg-rose-500 font-bold px-3 py-1.5 rounded-lg text-white transition w-full">Pilih Pemain 1</button>
          <p class="text-[10px] text-slate-400">Kontrol: <kbd class="bg-slate-800 px-1 rounded">A</kbd> <kbd class="bg-slate-800 px-1 rounded">D</kbd> <kbd class="bg-slate-800 px-1 rounded">W</kbd> | Pukul: <kbd class="bg-slate-800 px-1 rounded">F</kbd></p>
        </div>

        <!-- Slot Pemain 2 -->
        <div class="bg-slate-900 border border-slate-700 p-3 rounded-xl flex flex-col items-center space-y-2">
          <span class="text-xs font-bold text-sky-400">🔵 Pemain 2 (Kanan)</span>
          <span id="labelP2" class="text-[11px] text-slate-400 italic">Kosong</span>
          <button id="btnJoinP2" onclick="joinRole('p2')" class="text-xs bg-sky-600 hover:bg-sky-500 font-bold px-3 py-1.5 rounded-lg text-white transition w-full">Pilih Pemain 2</button>
          <p class="text-[10px] text-slate-400">Kontrol: <kbd class="bg-slate-800 px-1 rounded">←</kbd> <kbd class="bg-slate-800 px-1 rounded">→</kbd> <kbd class="bg-slate-800 px-1 rounded">↑</kbd> | Pukul: <kbd class="bg-slate-800 px-1 rounded">L</kbd></p>
        </div>

      </div>
      <button onclick="resetGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2 rounded-lg transition">
        RESET REMATCH PERTANDINGAN
      </button>
    </div>

    <!-- CANVAS ARENA PERTARUNGAN & CHAT -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Canvas Arena Stickman -->
      <div class="md:col-span-2 relative bg-slate-900 border border-slate-700 rounded-2xl p-2 flex justify-center items-center overflow-hidden">
        <canvas id="gameCanvas" width="460" height="280" class="rounded-xl border border-slate-800 w-full"></canvas>
      </div>

      <!-- KOLOM CHAT REALTIME -->
      <div class="flex flex-col bg-slate-800 border border-slate-700 rounded-2xl h-[296px] overflow-hidden">
        <div class="bg-slate-900 px-3 py-2 border-b border-slate-700 text-xs font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-comments text-amber-400"></i> Obrolan Room
        </div>
        <div id="chatMessages" class="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
          <div class="text-[11px] text-slate-500 italic text-center">Selamat datang di Arena Pukul Stickman!</div>
        </div>
        <div class="p-2 border-t border-slate-700 bg-slate-900 flex gap-1.5">
          <input type="text" id="chatInput" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Ketik pesan..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-amber-500">
          <button onclick="sendChatMessage()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://keadrtohkrjoltcissqj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__dXhUS3eSgSx6Op3hVIYpQ_IKMhqMos';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const roomChannel = client.channel('stickman-room-1v1', {
      config: { broadcast: { self: true } }
    });

    let myRole = 'spectator'; // 'p1', 'p2', 'spectator'
    let roomState = { p1: false, p2: false };
    const processedMessages = new Set();

    // --- SETUP CANVAS GAME ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GROUND_Y = 230;

    // Data Karakter Stickman
    let players = {
      p1: { x: 80, y: GROUND_Y, vx: 0, vy: 0, isGrounded: true, isAttacking: false, health: 100, color: '#f43f5e', name: 'Pemain 1' },
      p2: { x: 380, y: GROUND_Y, vx: 0, vy: 0, isGrounded: true, isAttacking: false, health: 100, color: '#38bdf8', name: 'Pemain 2' }
    };

    let keysPressed = {};

    // --- LOGIKA UTAMA & ANIMASI ENGINE ---
    document.addEventListener('keydown', (e) => {
      keysPressed[e.key.toLowerCase()] = true;
      handleAttackInput(e.key.toLowerCase());
    });

    document.addEventListener('keyup', (e) => {
      keysPressed[e.key.toLowerCase()] = false;
    });

    function handleAttackInput(key) {
      if (myRole === 'p1' && key === 'f' && !players.p1.isAttacking) {
        players.p1.isAttacking = true;
        checkHit('p1', 'p2');
        setTimeout(() => { players.p1.isAttacking = false; }, 200);
      }
      if (myRole === 'p2' && key === 'l' && !players.p2.isAttacking) {
        players.p2.isAttacking = true;
        checkHit('p2', 'p1');
        setTimeout(() => { players.p2.isAttacking = false; }, 200);
      }
    }

    function checkHit(attackerKey, defenderKey) {
      const atk = players[attackerKey];
      const def = players[defenderKey];

      // Jarak jangkauan pukulan
      const distance = Math.abs(atk.x - def.x);
      if (distance < 55 && Math.abs(atk.y - def.y) < 30) {
        def.health = Math.max(0, def.health - 10);
        
        // Broadcast kena pukulan
        roomChannel.send({
          type: 'broadcast',
          event: 'player_hit',
          payload: { defender: defenderKey, health: def.health }
        });
      }
    }

    function updatePhysics() {
      // Pergerakan Pemain 1
      if (myRole === 'p1' && players.p1.health > 0) {
        if (keysPressed['a']) players.p1.x = Math.max(20, players.p1.x - 3);
        if (keysPressed['d']) players.p1.x = Math.min(440, players.p1.x + 3);
        if (keysPressed['w'] && players.p1.isGrounded) {
          players.p1.vy = -9;
          players.p1.isGrounded = false;
        }
      }

      // Pergerakan Pemain 2
      if (myRole === 'p2' && players.p2.health > 0) {
        if (keysPressed['arrowleft']) players.p2.x = Math.max(20, players.p2.x - 3);
        if (keysPressed['arrowright']) players.p2.x = Math.min(440, players.p2.x + 3);
        if (keysPressed['arrowup'] && players.p2.isGrounded) {
          players.p2.vy = -9;
          players.p2.isGrounded = false;
        }
      }

      // Gravitasi Pemain
      ['p1', 'p2'].forEach(pKey => {
        let p = players[pKey];
        if (!p.isGrounded) {
          p.vy += 0.5; // gravitasi
          p.y += p.vy;
          if (p.y >= GROUND_Y) {
            p.y = GROUND_Y;
            p.vy = 0;
            p.isGrounded = true;
          }
        }
      });

      // Siarkan koordinat posisi ke Supabase jika peran aktif
      if (myRole !== 'spectator') {
        roomChannel.send({
          type: 'broadcast',
          event: 'sync_pos',
          payload: { role: myRole, x: players[myRole].x, y: players[myRole].y, isAttacking: players[myRole].isAttacking }
        });
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Gambar Pijakan Ring
      ctx.fillStyle = '#334155';
      ctx.fillRect(0, GROUND_Y + 10, canvas.width, canvas.height - GROUND_Y);
      ctx.strokeStyle = '#64748b';
      ctx.strokeRect(0, GROUND_Y + 10, canvas.width, 2);

      // Gambar Kedua Stickman
      drawStickman(players.p1, players.p1.x < players.p2.x ? 1 : -1);
      drawStickman(players.p2, players.p2.x < players.p1.x ? 1 : -1);

      // Gambar Health Bar di Atas
      drawHealthBar(15, 15, 160, 12, players.p1.health, '#f43f5e', '🔴 P1');
      drawHealthBar(285, 15, 160, 12, players.p2.health, '#38bdf8', '🔵 P2');

      // Cek Kondisi Menang / KO
      if (players.p1.health <= 0) drawKO('PEMAIN 2 MENANG!');
      else if (players.p2.health <= 0) drawKO('PEMAIN 1 MENANG!');
    }

    function drawStickman(p, dir) {
      if (p.health <= 0) {
        // Tampilan Stickman Kalah (Tergeletak)
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(p.x, p.y + 5, 8, 0, Math.PI * 2);
        ctx.moveTo(p.x - 8, p.y + 5); ctx.lineTo(p.x + 20, p.y + 5);
        ctx.stroke();
        return;
      }

      ctx.strokeStyle = p.color;
      ctx.fillStyle = p.color;
      ctx.lineWidth = 3;

      // Kepala
      ctx.beginPath();
      ctx.arc(p.x, p.y - 35, 8, 0, Math.PI * 2);
      ctx.fill();

      // Badan
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - 27);
      ctx.lineTo(p.x, p.y - 10);
      ctx.stroke();

      // Kaki
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - 10); ctx.lineTo(p.x - 8, p.y);
      ctx.moveTo(p.x, p.y - 10); ctx.lineTo(p.x + 8, p.y);
      ctx.stroke();

      // Tangan & Animasi Pukul
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - 22);
      if (p.isAttacking) {
        // Tangan Memanjang Memukul
        ctx.lineTo(p.x + (dir * 28), p.y - 22);
        // Efek Pukulan
        ctx.arc(p.x + (dir * 30), p.y - 22, 4, 0, Math.PI * 2);
      } else {
        ctx.lineTo(p.x - 8, p.y - 14);
        ctx.moveTo(p.x, p.y - 22);
        ctx.lineTo(p.x + 8, p.y - 14);
      }
      ctx.stroke();
    }

    function drawHealthBar(x, y, w, h, health, color, label) {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.fillRect(x, y, (health / 100) * w, h);
      ctx.strokeStyle = '#475569';
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = '#ffffff';
      ctx.font = '10px Inter, sans-serif';
      ctx.fillText(label, x, y - 4);
    }

    function drawKO(winnerText) {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fbbf24';
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2);
      ctx.textAlign = 'start';
    }

    function gameLoop() {
      updatePhysics();
      render();
      requestAnimationFrame(gameLoop);
    }

    // --- KONEKSI SUPABASE REALTIME ---
    roomChannel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        document.getElementById('statusGame').textContent = 'Terhubung ke Supabase Arena! Pilih slot Pemain.';
        roomChannel.send({ type: 'broadcast', event: 'request_state', payload: {} });
      }
    });

    roomChannel.on('broadcast', { event: 'sync_pos' }, ({ payload }) => {
      if (payload.role !== myRole && players[payload.role]) {
        players[payload.role].x = payload.x;
        players[payload.role].y = payload.y;
        players[payload.role].isAttacking = payload.isAttacking;
      }
    });

    roomChannel.on('broadcast', { event: 'player_hit' }, ({ payload }) => {
      if (players[payload.defender]) {
        players[payload.defender].health = payload.health;
      }
    });

    roomChannel.on('broadcast', { event: 'player_join' }, ({ payload }) => {
      updateLobbyUI(payload.role, true);
    });

    roomChannel.on('broadcast', { event: 'chat_msg' }, ({ payload }) => {
      addChatMessage(payload.sender, payload.message, payload.id);
    });

    roomChannel.on('broadcast', { event: 'request_state' }, () => {
      if (myRole !== 'spectator') {
        roomChannel.send({ type: 'broadcast', event: 'player_join', payload: { role: myRole } });
      }
    });

    roomChannel.on('broadcast', { event: 'reset_game' }, () => {
      players.p1.x = 80; players.p1.y = GROUND_Y; players.p1.health = 100;
      players.p2.x = 380; players.p2.y = GROUND_Y; players.p2.health = 100;
      myRole = 'spectator';
      roomState = { p1: false, p2: false };
      document.getElementById('playerRoleBadge').textContent = 'Penonton';
      document.getElementById('labelP1').textContent = 'Kosong';
      document.getElementById('btnJoinP1').disabled = false;
      document.getElementById('labelP2').textContent = 'Kosong';
      document.getElementById('btnJoinP2').disabled = false;
      addChatMessage('Sistem', '🔄 Game di-reset untuk rematch!', 'sys-' + Date.now());
    });

    function joinRole(role) {
      if (myRole !== 'spectator') return alert('Anda sudah memilih slot!');
      if (role === 'p1' && roomState.p1) return alert('Pemain 1 sudah terisi!');
      if (role === 'p2' && roomState.p2) return alert('Pemain 2 sudah terisi!');

      myRole = role;
      updateLobbyUI(role, true);

      document.getElementById('playerRoleBadge').textContent = role === 'p1' ? 'Pemain 1 (Kiri)' : 'Pemain 2 (Kanan)';
      document.getElementById('playerRoleBadge').className = role === 'p1' ? 'bg-rose-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase' : 'bg-sky-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full uppercase';

      roomChannel.send({ type: 'broadcast', event: 'player_join', payload: { role: role } });
    }

    function updateLobbyUI(role, isTaken) {
      if (role === 'p1') {
        roomState.p1 = isTaken;
        document.getElementById('labelP1').textContent = isTaken ? 'Terisi' : 'Kosong';
        document.getElementById('btnJoinP1').disabled = isTaken;
      } else if (role === 'p2') {
        roomState.p2 = isTaken;
        document.getElementById('labelP2').textContent = isTaken ? 'Terisi' : 'Kosong';
        document.getElementById('btnJoinP2').disabled = isTaken;
      }
    }

    function resetGame() {
      if (!confirm('Yakin ingin mereset pertandingan?')) return;
      roomChannel.send({ type: 'broadcast', event: 'reset_game', payload: {} });
    }

    // --- CHAT SYSTEM ---
    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;

      let senderName = myRole === 'p1' ? 'P1 (Kiri)' : (myRole === 'p2' ? 'P2 (Kanan)' : 'Penonton');
      
      roomChannel.send({
        type: 'broadcast',
        event: 'chat_msg',
        payload: { sender: senderName, message: msg, id: Date.now() + '_' + Math.random() }
      });

      input.value = '';
    }

    function addChatMessage(sender, message, msgId) {
      if (msgId && processedMessages.has(msgId)) return;
      if (msgId) processedMessages.add(msgId);

      const container = document.getElementById('chatMessages');
      const msgDiv = document.createElement('div');
      
      let badgeColor = sender === 'P1 (Kiri)' ? 'text-rose-400 font-bold' : (sender === 'P2 (Kanan)' ? 'text-sky-400 font-bold' : 'text-amber-400 font-bold');
      msgDiv.innerHTML = `<span class="${badgeColor}">${sender}:</span> <span class="text-slate-200">${escapeHtml(message)}</span>`;
      
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function (s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }

    // Jalankan Game Loop Loop
    gameLoop();
  </script>
</body>
</html>
