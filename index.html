<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FORMAT TRANSAKSI ELEGAN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    #bgVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -10;
    }
    @keyframes modalShow {
      from { opacity: 0; transform: scale(0.96) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-animate {
      animation: modalShow 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 10, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(52, 211, 153, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(52, 211, 153, 0.6);
    }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

  <!-- ELEMEN VIDEO BACKGROUND -->
  <video id="bgVideo" autoplay muted loop playsinline class="hidden">
    <source id="videoSource" src="" type="video/mp4">
  </video>

  <div class="max-w-2xl w-full space-y-6 z-10 py-8">

    <!-- CONTAINER UTAMA FORMAT TRANSAKSI -->
    <div class="bg-zinc-950/80 backdrop-blur-xl border border-zinc-800 shadow-[0_8px_30px_rgb(0,0,0,0.8)] rounded-3xl p-6 md:p-8 transition-all">
      
      <!-- Header & Fitur Ganti Background -->
      <div class="flex items-center justify-between border-b border-zinc-800 pb-5 mb-6">
        <div class="flex items-center space-x-3.5">
          <div class="p-3.5 bg-gradient-to-br from-emerald-500/20 to-teal-500/10 text-emerald-400 rounded-2xl border border-emerald-500/20 shadow-inner">
            <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
          </div>
          <div>
            <h1 class="text-lg md:text-xl font-bold tracking-tight text-white">FORMAT CEK TRANSAKSI</h1>
            <p class="text-xs text-zinc-400 mt-0.5">Target Proses: <span id="currentTabLabel" class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md font-mono-code font-bold">GRUPING 1</span></p>
          </div>
        </div>

        <!-- OPSI AKSI HEADER -->
        <div class="flex items-center space-x-2">
          <label class="cursor-pointer bg-zinc-900 hover:bg-zinc-800 text-zinc-300 hover:text-white px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition border border-zinc-800 shadow-sm" title="Upload & Sync Video/BG ke Semua Perangkat">
            <i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i>
            <span class="hidden sm:inline">Background</span>
            <input type="file" id="bgUploader" accept="video/mp4,image/*" class="hidden" onchange="uploadAndSyncBackground(event)">
          </label>

          <button id="btnResetBg" onclick="resetAndSyncBackground()" class="hidden bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 p-2.5 rounded-xl text-xs transition border border-rose-500/20" title="Reset Background Default">
            <i class="fa-solid fa-trash-can"></i>
          </button>

          <button onclick="toggleSettings()" class="text-zinc-400 hover:text-white p-2.5 rounded-xl hover:bg-zinc-900 transition border border-zinc-800" title="Pengaturan URL Backend">
            <i class="fa-solid fa-gear text-sm"></i>
          </button>
        </div>
      </div>

      <!-- TAB NAVIGASI GRUPING 1 - 5 -->
      <div class="mb-6">
        <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2.5">Pilih Gruping:</label>
        <div class="grid grid-cols-5 gap-2 p-1.5 bg-black border border-zinc-800 rounded-2xl shadow-inner">
          <button onclick="switchTab('GRUPING 1')" id="tab-GRUPING 1" class="tab-btn py-2.5 font-bold rounded-xl transition text-xs bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-900/20">GRUP 1</button>
          <button onclick="switchTab('GRUPING 2')" id="tab-GRUPING 2" class="tab-btn py-2.5 font-bold rounded-xl transition text-xs text-zinc-400 hover:text-white hover:bg-zinc-900">GRUP 2</button>
          <button onclick="switchTab('GRUPING 3')" id="tab-GRUPING 3" class="tab-btn py-2.5 font-bold rounded-xl transition text-xs text-zinc-400 hover:text-white hover:bg-zinc-900">GRUP 3</button>
          <button onclick="switchTab('GRUPING 4')" id="tab-GRUPING 4" class="tab-btn py-2.5 font-bold rounded-xl transition text-xs text-zinc-400 hover:text-white hover:bg-zinc-900">GRUP 4</button>
          <button onclick="switchTab('GRUPING 5')" id="tab-GRUPING 5" class="tab-btn py-2.5 font-bold rounded-xl transition text-xs text-zinc-400 hover:text-white hover:bg-zinc-900">GRUP 5</button>
        </div>
      </div>

      <!-- Panel Pengaturan URL -->
      <div id="settingsPanel" class="hidden mb-6 p-4 bg-black border border-zinc-800 rounded-2xl space-y-3 shadow-xl">
        <label class="block text-xs font-semibold text-zinc-300">URL Backend API (Vercel):</label>
        <input type="text" id="scriptUrl" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-xs text-zinc-100 focus:outline-none focus:border-emerald-500 font-mono-code transition" placeholder="https://gamebarumenyenangkan.vercel.app">
        <div class="flex justify-end space-x-2 pt-1">
          <button onclick="saveSettings()" class="px-4 py-2 text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition shadow-md shadow-emerald-900/20">Simpan URL</button>
        </div>
      </div>

      <!-- Textarea Input -->
      <div class="space-y-2.5 mb-5">
        <div class="flex justify-between items-center text-xs text-zinc-300">
          <label for="inputText" class="font-semibold tracking-wide">Tempel Data Transaksi:</label>
          <div>
            <button onclick="pasteFromClipboard()" class="text-emerald-400 hover:text-emerald-300 transition flex items-center gap-1.5 font-bold bg-emerald-500/10 px-2.5 py-1 rounded-lg border border-emerald-500/20">
              <i class="fa-regular fa-clipboard"></i> Paste Teks
            </button>
          </div>
        </div>

        <div class="relative">
          <textarea id="inputText" rows="5" class="w-full bg-black border border-zinc-800 focus:border-emerald-500/80 text-zinc-100 placeholder-zinc-600 rounded-2xl p-4 focus:outline-none transition resize-none text-sm leading-relaxed shadow-inner" placeholder="Tempel atau paste data transaksi di sini..."></textarea>
          <div class="absolute bottom-3 right-4 text-[11px] text-zinc-500 pointer-events-none font-mono-code">
            <span id="charCount">0</span> kar
          </div>
        </div>
      </div>

      <!-- Status Alert -->
      <div id="statusBox" class="hidden mb-5 p-3.5 rounded-2xl text-xs flex items-center gap-2.5 font-medium border bg-black shadow-lg"></div>

      <!-- ACTION BUTTON (Hanya 1 Tombol Utama Kirim Transaksi) -->
      <div>
        <button id="sendBtn" onclick="sendToSheet()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 active:scale-[0.98] text-white font-semibold py-4 px-6 rounded-2xl transition-all shadow-lg shadow-emerald-900/30 flex items-center justify-center space-x-2 text-sm tracking-wide">
          <i class="fa-solid fa-paper-plane text-emerald-200 text-base"></i>
          <span id="btnText">Kirim Transaksi</span>
        </button>
      </div>

    </div>

  </div>

  <!-- POP-UP MODAL HASIL FORMAT -->
  <div id="resultModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
    <div id="modalContent" class="bg-zinc-950 border border-zinc-800 shadow-[0_20px_50px_rgba(0,0,0,0.9)] rounded-3xl max-w-2xl w-full max-h-[92vh] flex flex-col transform scale-95 transition-all duration-300 overflow-hidden">
      
      <div class="flex items-center justify-between px-6 py-4.5 border-b border-zinc-800 bg-black">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-xl border border-emerald-500/20">
            <i class="fa-solid fa-file-lines text-base"></i>
          </div>
          <h2 class="text-sm md:text-base font-bold text-white tracking-tight">Hasil Format Pesanan (<span id="modalTabTitle" class="text-emerald-400">GRUPING 1</span>)</h2>
        </div>
        <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-2 rounded-xl hover:bg-zinc-900 transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-6 space-y-4 overflow-y-auto">
        <div class="bg-black border border-zinc-800 rounded-2xl p-4 space-y-2.5 shadow-inner">
          <div class="flex justify-between items-center text-xs font-semibold text-zinc-300">
            <span class="tracking-wide">Format Standar (A1):</span>
            <button onclick="copyToClipboard('boxA1', 'toastA1')" class="bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 font-bold text-[11px]">
              <i class="fa-regular fa-copy"></i> Salin <span id="toastA1" class="text-[10px] text-emerald-200 hidden">✓ Disalin!</span>
            </button>
          </div>
          <div id="boxA1" class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 text-xs md:text-sm font-mono-code text-zinc-200 whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed shadow-inner"></div>
        </div>

        <div id="wrapperA2" class="hidden bg-black border border-amber-500/30 rounded-2xl p-4 space-y-2.5 shadow-inner">
          <div class="flex justify-between items-center text-xs font-semibold text-amber-400">
            <span class="tracking-wide">Format WD Di Atas 100Jt (A2):</span>
            <button onclick="copyToClipboard('boxA2', 'toastA2')" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 font-bold text-[11px]">
              <i class="fa-regular fa-copy"></i> Salin <span id="toastA2" class="text-[10px] text-amber-200 hidden">✓ Disalin!</span>
            </button>
          </div>
          <div id="boxA2" class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 text-xs md:text-sm font-mono-code text-zinc-200 whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed shadow-inner"></div>
        </div>

        <div id="wrapperA3" class="hidden bg-black border border-sky-500/30 rounded-2xl p-4 space-y-2.5 shadow-inner">
          <div class="flex justify-between items-center text-xs font-semibold text-sky-400">
            <span class="tracking-wide">Format WD Di Atas 50Jt (A3):</span>
            <button onclick="copyToClipboard('boxA3', 'toastA3')" class="bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 border border-sky-500/30 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5 font-bold text-[11px]">
              <i class="fa-regular fa-copy"></i> Salin <span id="toastA3" class="text-[10px] text-sky-200 hidden">✓ Disalin!</span>
            </button>
          </div>
          <div id="boxA3" class="bg-zinc-950 border border-zinc-900 rounded-xl p-4 text-xs md:text-sm font-mono-code text-zinc-200 whitespace-pre-wrap max-h-48 overflow-y-auto leading-relaxed shadow-inner"></div>
        </div>
      </div>

      <div class="px-6 py-4 border-t border-zinc-800 bg-black flex justify-end">
        <button onclick="closeModal()" class="px-5 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-semibold rounded-xl transition shadow">
          Tutup
        </button>
      </div>

    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://keadrtohkrjoltcissqj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__dXhUS3eSgSx6Op3hVIYpQ_IKMhqMos';

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const bgChannel = client.channel('app-bg-sync', { config: { broadcast: { self: true } } });

    const DEFAULT_URL = '';
    let currentTab = 'GRUPING 1';

    document.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      document.getElementById('scriptUrl').value = savedUrl;
      document.getElementById('inputText').addEventListener('input', updateCharCount);
      loadSavedBackground();
    });

    // --- SINKRONISASI REALTIME & SUPABASE STORAGE DENGAN AUTO-DELETE ---
    bgChannel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        bgChannel.send({ type: 'broadcast', event: 'request_bg', payload: {} });
      }
    });

    bgChannel.on('broadcast', { event: 'update_bg' }, ({ payload }) => {
      if (payload.mediaUrl) {
        applyBackground(payload.mediaUrl, payload.mediaType);
        localStorage.setItem('custom_app_bg', payload.mediaUrl);
        localStorage.setItem('custom_app_bg_type', payload.mediaType);
      } else {
        resetBackgroundLocal();
      }
    });

    bgChannel.on('broadcast', { event: 'request_bg' }, () => {
      const currentBg = localStorage.getItem('custom_app_bg');
      const currentType = localStorage.getItem('custom_app_bg_type');
      if (currentBg) {
        bgChannel.send({ type: 'broadcast', event: 'update_bg', payload: { mediaUrl: currentBg, mediaType: currentType } });
      }
    });

    async function uploadAndSyncBackground(event) {
      const file = event.target.files[0];
      if (!file) return;

      showStatus('Mengunggah file ke Supabase Storage...', 'info');

      const isVideo = file.type.startsWith('video/');
      const fileExt = file.name.split('.').pop();
      const fileName = `bg_${Date.now()}.${fileExt}`;

      const { data: existingFiles, error: listError } = await client.storage
        .from('backgrounds')
        .list();

      if (listError) {
        console.error("Gagal mengambil list file lama:", listError.message);
      }

      const { data, error } = await client.storage
        .from('backgrounds')
        .upload(fileName, file, { cacheControl: '3600', upsert: true });

      if (error) {
        alert('Gagal mengunggah file: ' + error.message);
        showStatus('Gagal mengunggah background.', 'error');
        return;
      }

      const { data: publicURLData } = client.storage
        .from('backgrounds')
        .getPublicUrl(fileName);

      const publicUrl = publicURLData.publicUrl;
      const mediaType = isVideo ? 'video' : 'image';

      applyBackground(publicUrl, mediaType);
      localStorage.setItem('custom_app_bg', publicUrl);
      localStorage.setItem('custom_app_bg_type', mediaType);

      bgChannel.send({
        type: 'broadcast',
        event: 'update_bg',
        payload: { mediaUrl: publicUrl, mediaType: mediaType }
      });

      showStatus('Background berhasil disinkronkan & dibersihkan otomatis!', 'success');

      if (existingFiles && existingFiles.length > 0) {
        const filesToDelete = existingFiles
          .map(f => f.name)
          .filter(name => name !== fileName);

        if (filesToDelete.length > 0) {
          const { error: deleteError } = await client.storage
            .from('backgrounds')
            .remove(filesToDelete);
            
          if (deleteError) {
            console.error("Gagal menghapus file lama:", deleteError.message);
          }
        }
      }
    }

    function resetAndSyncBackground() {
      resetBackgroundLocal();
      bgChannel.send({ type: 'broadcast', event: 'update_bg', payload: { mediaUrl: null, mediaType: null } });
      showStatus('Background di-reset untuk semua perangkat.', 'info');
    }

    function resetBackgroundLocal() {
      document.body.style.backgroundImage = 'none';
      const videoEl = document.getElementById('bgVideo');
      videoEl.pause();
      videoEl.classList.add('hidden');
      localStorage.removeItem('custom_app_bg');
      localStorage.removeItem('custom_app_bg_type');
      document.getElementById('btnResetBg').classList.add('hidden');
      document.getElementById('bgUploader').value = '';
    }

    function applyBackground(mediaUrl, mediaType) {
      const videoEl = document.getElementById('bgVideo');
      const sourceEl = document.getElementById('videoSource');

      if (mediaType === 'video') {
        document.body.style.backgroundImage = 'none';
        sourceEl.src = mediaUrl;
        videoEl.load();
        videoEl.classList.remove('hidden');
        videoEl.play().catch(err => console.log("Autoplay dicegah browser:", err));
      } else {
        videoEl.pause();
        videoEl.classList.add('hidden');
        document.body.style.backgroundImage = `url('${mediaUrl}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundAttachment = 'fixed';
      }
      document.getElementById('btnResetBg').classList.remove('hidden');
    }

    function loadSavedBackground() {
      const savedBg = localStorage.getItem('custom_app_bg');
      const savedType = localStorage.getItem('custom_app_bg_type') || 'image';
      if (savedBg) applyBackground(savedBg, savedType);
    }

    // --- LOGIKA FORMAT TRANSAKSI ---
    function switchTab(tabName) {
      currentTab = tabName;
      document.getElementById('currentTabLabel').textContent = tabName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn py-2.5 font-bold rounded-xl transition text-xs text-zinc-400 hover:text-white hover:bg-zinc-900";
      });
      const activeBtn = document.getElementById(`tab-${tabName}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn py-2.5 font-bold rounded-xl transition text-xs bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-900/20";
      }
      showStatus(`Aktif di ${tabName}`, 'info');
    }

    function updateCharCount() {
      document.getElementById('charCount').textContent = document.getElementById('inputText').value.length;
    }

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('hidden');
    }

    function saveSettings() {
      const url = document.getElementById('scriptUrl').value.trim();
      localStorage.setItem('gs_script_url', url);
      showStatus('URL Backend berhasil disimpan!', 'success');
      toggleSettings();
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('inputText').value = text;
        updateCharCount();
        showStatus('Teks berhasil ditempel dari clipboard!', 'info');
      } catch (err) { alert('Gagal membaca clipboard.'); }
    }

    function sendToSheet() {
      const text = document.getElementById('inputText').value;
      const baseUrl = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      if (!text.trim()) return showStatus('Isi teks terlebih dahulu!', 'error');

      setLoading(true, 'sendBtn', 'btnText', '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim & Memproses...');
      hideStatus();

      fetch(`${baseUrl}/api`, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' }, 
        body: JSON.stringify({ action: "appendSheet", text: text, sheetName: currentTab }) 
      })
      .then(res => res.json())
      .then(data => { 
        showStatus(`Berhasil dikirim ke ${currentTab}!`, 'success'); 
        setTimeout(fetchFormatOnly, 800); 
      })
      .catch(err => {
        showStatus(`Gagal kirim: ${err.message}`, 'error');
        setLoading(false, 'sendBtn', 'btnText', 'Kirim Transaksi');
      });
    }

    function fetchFormatOnly() {
      const baseUrl = localStorage.getItem('gs_script_url') || DEFAULT_URL;
      showStatus(`Memuat format dari ${currentTab}...`, 'info');

      fetch(`${baseUrl}/api`, { 
        method: 'POST', 
        headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify({ action: "getFormat", sheetName: currentTab }) 
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.isiA1 !== undefined) {
          document.getElementById('modalTabTitle').textContent = currentTab;
          displayFormatResult(data);
          openModal();
          showStatus(`Format ${currentTab} dimuat!`, 'success');
        } else {
          showStatus(`Gagal memuat format`, 'error');
        }
      })
      .catch(err => showStatus(`Koneksi error: ${err.message}`, 'error'))
      .finally(() => setLoading(false, 'sendBtn', 'btnText', 'Kirim Transaksi'));
    }

    function displayFormatResult(data) {
      document.getElementById('boxA1').textContent = data.isiA1 || '-';
      
      const wrapA2 = document.getElementById('wrapperA2');
      if (data.adaWithdrawDiatas100Jt) { 
        wrapA2.classList.remove('hidden'); 
        document.getElementById('boxA2').textContent = data.isiA2; 
      } else { 
        wrapA2.classList.add('hidden'); 
      }

      const wrapA3 = document.getElementById('wrapperA3');
      if (data.adaWithdrawDiatas50Jt) { 
        wrapA3.classList.remove('hidden'); 
        document.getElementById('boxA3').textContent = data.isiA3; 
      } else { 
        wrapA3.classList.add('hidden'); 
      }
    }

    function openModal() {
      document.getElementById('inputText').value = '';
      updateCharCount();

      const modal = document.getElementById('resultModal');
      modal.classList.remove('hidden');
      setTimeout(() => { modal.classList.remove('opacity-0'); document.getElementById('modalContent').classList.remove('scale-95'); }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('resultModal');
      modal.classList.add('opacity-0');
      document.getElementById('modalContent').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function copyToClipboard(boxId, toastId) {
      navigator.clipboard.writeText(document.getElementById(boxId).textContent).then(() => {
        const toast = document.getElementById(toastId);
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2000);
      });
    }

    function setLoading(isLoading, btnId, textId, htmlContent) {
      const btn = document.getElementById(btnId);
      btn.disabled = isLoading;
      if (isLoading) btn.classList.add('opacity-75', 'cursor-not-allowed');
      else btn.classList.remove('opacity-75', 'cursor-not-allowed');
      if (textId) document.getElementById(textId).innerHTML = htmlContent;
    }

    function showStatus(msg, type) {
      const box = document.getElementById('statusBox');
      box.classList.remove('hidden', 'border-emerald-500/30', 'border-rose-500/30', 'border-sky-500/30', 'text-emerald-300', 'text-rose-300', 'text-sky-300');
      let icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : (type === 'error' ? '<i class="fa-solid fa-triangle-exclamation text-rose-400"></i>' : '<i class="fa-solid fa-circle-info text-sky-400"></i>');
      let borderColor = type === 'success' ? 'border-emerald-500/30' : (type === 'error' ? 'border-rose-500/30' : 'border-sky-500/30');
      box.classList.add(borderColor);
      box.innerHTML = `${icon} <span class="text-zinc-200">${msg}</span>`;
    }

    function hideStatus() { document.getElementById('statusBox').classList.add('hidden'); }
  </script>
</body>
