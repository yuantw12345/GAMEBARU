<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiba Tiba Tournament - Cek Transaksi & Synced Background</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Background Video Container */
        #bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #111;
        }

        #bg-video, #bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Panel Kontrol di Pojok Kanan Atas */
        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-sync {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-sync:hover {
            background: #16a34a;
        }

        #file-input {
            display: none;
        }

        /* Konten Utama Aplikasi (Cek Transaksi & Format) */
        .main-content {
            position: relative;
            z-index: 1;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .card {
            background: rgba(0, 0, 0, 0.65);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h1 {
            margin-bottom: 5px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: white;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
            margin-top: 10px;
        }

        textarea:focus {
            outline: none;
            border-color: #22c55e;
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Video / Gambar -->
    <div id="bg-container">
        <video id="bg-video" autoplay muted loop playsinline style="display: none;"></video>
        <img id="bg-image" style="display: none;" alt="Background">
    </div>

    <!-- Panel Tombol Sinkronisasi Background -->
    <div class="control-panel">
        <span id="status-text" style="font-size: 12px; color: #cbd5e1;">Terhubung</span>
        <button class="btn-sync" onclick="document.getElementById('file-input').click()">Sync Video/BG</button>
        <input type="file" id="file-input" accept="video/mp4,image/*" onchange="handleFileSelect(event)">
    </div>

    <!-- Konten Utama (Fitur Cek Transaksi & Format Anda) -->
    <div class="main-content">
        <h1>Tiba Tiba Tournament</h1>
        <p>Panel Admin & Cek Transaksi / Format</p>

        <div class="card">
            <h3>Cek Format / Transaksi</h3>
            <p style="font-size: 13px; color: #94a3b8;">Masukkan teks atau data transaksi di bawah untuk pengecekan:</p>
            <textarea id="transaction-input" placeholder="Tempel data transaksi atau format di sini..."></textarea>
            <button class="btn-sync" style="margin-top: 10px;" onclick="checkTransaction()">Cek Format</button>
            <div id="result-output" style="margin-top: 10px; font-weight: bold; color: #4ade80;"></div>
        </div>
    </div>

    <script>
        // --- KONFIGURASI SUPABASE ---
        // Masukkan kredensial project Supabase Anda di sini
        const SUPABASE_URL = 'https://URL_PROJECT_ANDA.supabase.co';
        const SUPABASE_KEY = 'SUPABASE_ANON_KEY_ANDA';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const channel = supabase.channel('room_background_sync');

        // Fungsi untuk merubah background di layar (Video atau Gambar)
        function applyBackground(url) {
            const videoEl = document.getElementById('bg-video');
            const imageEl = document.getElementById('bg-image');

            if (url.match(/\.(mp4|webm|ogg)$/i)) {
                imageEl.style.display = 'none';
                videoEl.style.display = 'block';
                videoEl.src = url;
                videoEl.load();
                videoEl.play().catch(e => console.log("Autoplay dicegah browser:", e));
            } else {
                videoEl.style.display = 'none';
                imageEl.style.display = 'block';
                imageEl.src = url;
            }
        }

        // Fungsi Upload file ke Supabase Storage + Fitur Auto-Delete File Lama
        async function uploadAndSyncBackground(file) {
            const statusText = document.getElementById('status-text');
            statusText.innerText = "Mengunggah...";

            const fileExt = file.name.split('.').pop();
            const fileName = `bg_${Date.now()}.${fileExt}`;
            const filePath = `${fileName}`;

            // 1. Ambil daftar file lama di bucket backgrounds untuk dibersihkan
            const { data: existingFiles, error: listError } = await supabase.storage
                .from('backgrounds')
                .list();

            if (listError) {
                console.error("Gagal mengambil list file lama:", listError.message);
            }

            // 2. Upload file baru ke Supabase Storage
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('backgrounds')
                .upload(filePath, file);

            if (uploadError) {
                alert("Gagal mengunggah file: " + uploadError.message);
                statusText.innerText = "Gagal upload";
                return;
            }

            // 3. Ambil Public URL dari file yang baru di-upload
            const { data: publicUrlData } = supabase.storage
                .from('backgrounds')
                .getPublicUrl(filePath);
            
            const newBackgroundUrl = publicUrlData.publicUrl;

            // 4. Broadcast URL baru secara realtime ke perangkat lain
            channel.send({
                type: 'broadcast',
                event: 'background_update',
                payload: { url: newBackgroundUrl }
            });

            // 5. Terapkan langsung ke perangkat pengirim
            applyBackground(newBackgroundUrl);
            statusText.innerText = "Berhasil Disinkron!";

            // 6. AUTO-DELETE: Hapus file video/gambar lama di server secara otomatis
            if (existingFiles && existingFiles.length > 0) {
                const filesToDelete = existingFiles
                    .map(f => f.name)
                    .filter(name => name !== fileName); // Kecualikan file yang baru di-upload

                if (filesToDelete.length > 0) {
                    const { error: deleteError } = await supabase.storage
                        .from('backgrounds')
                        .remove(filesToDelete);
                        
                    if (deleteError) {
                        console.error("Gagal menghapus file lama:", deleteError.message);
                    } else {
                        console.log("File background lama berhasil dibersihkan otomatis dari server!");
                    }
                }
            }
        }

        // Handler saat memilih file dari tombol
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadAndSyncBackground(file);
            }
        }

        // Contoh fungsi cek transaksi/format Anda
        function checkTransaction() {
            const text = document.getElementById('transaction-input').value;
            const output = document.getElementById('result-output');
            if (!text.trim()) {
                output.style.color = '#f87171';
                output.innerText = "Mohon masukkan data teks terlebih dahulu!";
                return;
            }
            output.style.color = '#4ade80';
            output.innerText = "Format / Transaksi Berhasil Dicek & Valid!";
        }

        // --- SETUP SUPABASE REALTIME LISTENER ---
        channel
            .on('broadcast', { event: 'background_update' }, (payload) => {
                console.log("Menerima background baru dari broadcast:", payload.payload.url);
                applyBackground(payload.payload.url);
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    console.log('Terhubung ke Supabase Realtime Channel!');
                }
            });
    </script>
</body>
</html>
